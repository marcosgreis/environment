set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

set -g default-terminal "screen-256color"

set -g status-bg colour34
set -g status-fg colour16
set-option -sg escape-time 200
set -g default-command "/bin/bash"

# Dim inactive panes
set -g window-style 'fg=colour245'
# Keep active pane with normal background
set -g window-active-style 'fg=color255'

# Set title
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,*,·} (#{s/%%//:pane_id}) #{pane_title}"

# # Install plugin
# run-shell ${HOME}/work/tmux-resurrect/resurrect.tmux

# # Save/restore per-window env vars
# set -g @resurrect-hook-pre-save-all 'bash ~/.tmux/scripts/save-env.sh'
# set -g @resurrect-hook-post-restore-all 'sleep 1 && bash ~/.tmux/scripts/restore-env.sh'

set -g extended-keys-format csi-u
set -g extended-keys on

# Enable true color (RGB) so gruvbox hex colors render exactly
set -as terminal-features ',xterm-256color:RGB,xterm-ghostty:RGB'

# ---- Gruvbox-flavored choose-tree (prefix + w) ----
# Highlight bar for the selected line (also affects copy-mode selection)
set -g mode-style 'bg=#504945,fg=#ebdbb2'

# Sessions: purple · Windows: yellow name, green command, gray path · Panes: blue
# Popup pane picker: pi /running
bind k display-popup -E -w 80% -h 70% "pi '/running' --exit-on-selection"
bind j display-popup -E -w 80% -h 70% "pr-tracker dashboard --no-refresh"

bind w choose-tree -Zw -F "#{?pane_format,#[fg=#83a598]#{pane_current_command}#[fg=#928374] · #{pane_title},#{?window_format,#[fg=#fabd2f bold]#{window_name}#[default] #[fg=#b8bb26]#{pane_current_command} #[fg=#928374]#{s|${HOME}|~|:pane_current_path},#[fg=#d3869b bold]#{session_name}#[default] #[fg=#928374](#{session_windows} windows)#{?session_attached, #[fg=#8ec07c]● attached,}}}"
